<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Futuro - Gestão de Tags (Caderno)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">

    <script>
        if (localStorage.getItem('meufuturo_logado') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button onclick="window.location.href='home.html'" class="text-slate-400 hover:text-blue-400 transition" title="Voltar ao Menu"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                <h1 class="text-lg font-bold text-blue-400">Meu Futuro <span class="text-xs text-slate-400 font-normal">| Caderno de Tags</span></h1>
            </div>
            <button onclick="window.location.href='agenda.html'" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-calendar-days mr-1"></i> Ir para Agenda</button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-2xl mx-auto p-4 md:p-6 space-y-6">

        <!-- Card de Cadastro de Nova Tag -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg space-y-4">
            <h3 class="text-sm font-bold text-blue-400 uppercase tracking-wide"><i class="fa-solid fa-tag mr-1.5"></i> Criar Nova Tag / Assunto</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">Nome da Tag (Ex: Igreja, Projeto X, Estudos...)</label>
                    <input type="text" id="novaTagNome" placeholder="Digite o nome do assunto..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500 transition">
                </div>
                <button type="button" onclick="salvarNovaTag()" class="w-full bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-3 text-xs font-bold transition shadow-lg shadow-blue-900/30">Salvar Nova Tag na Nuvem</button>
            </div>
        </div>

        <!-- Lista de Tags Cadastradas -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg space-y-4">
            <h3 class="text-base font-bold text-white flex items-center"><i class="fa-solid fa-tags mr-2 text-blue-400"></i>Suas Tags / Cadernos Ativos</h3>
            
            <div id="listaTagsContainer" class="space-y-2">
                <p class="text-xs text-slate-500 text-center py-6">Carregando tags...</p>
            </div>
        </div>

    </main>

    <script src="supabase.js"></script>

    <script>
        async function carregarTags() {
            const container = document.getElementById('listaTagsContainer');
            container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Buscando tags...</p>';

            const { data, error } = await _supabase.from('meufuturo_tags').select('*').order('nome', { ascending: true });

            if(error || !data || data.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 text-center py-6">Nenhuma tag cadastrada ainda.</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(t => {
                container.innerHTML += `
                    <div class="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                        <span class="font-bold text-white text-sm flex items-center"><i class="fa-solid fa-hashtag text-blue-400 mr-1.5"></i>${t.nome}</span>
                        <button onclick="deletarTag('${t.id}', '${t.nome}')" class="text-rose-400 hover:text-rose-300 p-2" title="Excluir tag"><i class="fa-solid fa-trash text-sm"></i></button>
                    </div>
                `;
            });
        }

        async function salvarNovaTag() {
            const input = document.getElementById('novaTagNome');
            const nome = input.value.trim();
            if(!nome) return alert('Digite o nome da tag!');

            const { error } = await _supabase.from('meufuturo_tags').insert([{ nome }]);
            if(error) return alert('Erro ao salvar tag (talvez já exista): ' + error.message);

            input.value = '';
            carregarTags();
        }

        async function deletarTag(id, nome) {
            if(!confirm(`Deseja remover a tag #${nome}?`)) return;
            const { error } = await _supabase.from('meufuturo_tags').delete().eq('id', id);
            if(error) return alert('Erro ao excluir: ' + error.message);
            carregarTags();
        }

        carregarTags();
    </script>
</body>
</html>
