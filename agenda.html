<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Futuro - Agenda & Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">

    <script>
        if (localStorage.getItem('meufuturo_logado') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button onclick="window.location.href='home.html'" class="text-slate-400 hover:text-blue-400 transition" title="Voltar ao Menu"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                <h1 class="text-lg font-bold text-blue-400">Meu Futuro <span class="text-xs text-slate-400 font-normal">| Agenda & Dashboard</span></h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="window.location.href='tags.html'" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-lg transition" title="Gerenciar Cadernos"><i class="fa-solid fa-book mr-1"></i> Cadernos</button>
                <button onclick="abrirModalCriar()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-lg shadow-blue-900/30"><i class="fa-solid fa-plus mr-1"></i> Novo Bloco</button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">

        <!-- Barra de Filtro por Caderno (Tags) -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg space-y-2">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider"><i class="fa-solid fa-filter mr-1.5 text-blue-400"></i>Filtrar por Caderno</span>
                <span id="filtroAtivoTexto" class="text-xs text-blue-400 font-bold">Exibindo: Tudo</span>
            </div>
            <div id="barraFiltroTags" class="flex flex-wrap gap-2 pt-1">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <!-- Dashboard Gráfico do Dia -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-chart-pie text-blue-400"></i>
                    <h3 class="text-sm font-bold text-blue-400 uppercase tracking-wide">Distribuição do Tempo (Dashboard)</h3>
                </div>
                <span id="dataAtualTexto" class="text-xs text-slate-400"></span>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                <div class="relative w-full h-48 flex justify-center">
                    <canvas id="graficoDashboard"></canvas>
                </div>
                <div id="resumoTextoDashboard" class="space-y-2 bg-slate-950/60 p-4 rounded-xl border border-slate-800 text-xs max-h-48 overflow-y-auto">
                    <!-- Gerenciado via JS -->
                </div>
            </div>
        </div>

        <!-- Seção da Linha do Tempo / Horários do Dia com Navegação de Dias -->
        <section class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-center border-b border-slate-800 pb-3 gap-3">
                <h3 class="text-base font-bold text-white flex items-center"><i class="fa-solid fa-calendar-day mr-2 text-blue-400"></i>Agenda Diária</h3>
                
                <div class="flex items-center space-x-2">
                    <button onclick="mudarDia(-1)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-bold transition" title="Dia Anterior"><i class="fa-solid fa-chevron-left"></i></button>
                    <input type="date" id="filtroDataAgenda" onchange="carregarAgenda()" class="bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white outline-none">
                    <button onclick="mudarDia(1)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-bold transition" title="Próximo Dia"><i class="fa-solid fa-chevron-right"></i></button>
                    <button onclick="irParaHoje()" class="bg-blue-900/40 border border-blue-700/50 hover:bg-blue-900/60 text-blue-300 px-3 py-1.5 rounded-xl text-xs font-bold transition">Hoje</button>
                </div>
            </div>

            <!-- Lista de Blocos do Dia -->
            <div class="space-y-3" id="listaAgenda">
                <p class="text-xs text-slate-500 text-center py-6">Carregando programação...</p>
            </div>
        </section>

    </main>

    <!-- Modal Compromisso (Criar / Editar) -->
    <div id="modalCompromisso" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modalTituloForm" class="text-lg font-bold text-blue-400"><i class="fa-solid fa-calendar-plus mr-2"></i>Novo Bloco de Rotina</h3>
                <button onclick="fecharModalCompromisso()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3">
                <input type="hidden" id="compId">
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">Título da Atividade</label>
                    <input type="text" id="compTitulo" placeholder="Ex: Culto de Ensino, Trabalho..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Caderno (Assunto)</label>
                        <select id="compTag" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none">
                            <!-- Preenchido via banco -->
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Local (Opcional)</label>
                        <input type="text" id="compLocal" placeholder="Ex: Templo, Escritório..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Início</label>
                        <input type="time" id="compInicio" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Término</label>
                        <input type="time" id="compFim" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">Data</label>
                    <input type="date" id="compData" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white outline-none">
                </div>
                <div id="divRepetirContainer">
                    <label class="text-[10px] text-slate-400 block mb-1">Repetição</label>
                    <select id="compRepetir" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none">
                        <option value="nenhum">Apenas neste dia (Único)</option>
                        <option value="seg_a_sex">Segunda a Sexta (Próximas 4 semanas)</option>
                        <option value="semanal">Toda semana (Próximas 8 semanas)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">Descrição / Anotações do Caderno</label>
                    <textarea id="compDesc" rows="2" placeholder="O que aconteceu ou foi programado?" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="fecharModalCompromisso()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold">Cancelar</button>
                    <button type="button" id="btnSalvarCompromisso" onclick="salvarCompromisso()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition">Salvar Bloco</button>
                </div>
            </div>
        </div>
    </div>

    <script src="supabase.js"></script>

    <script>
        const hojeIso = new Date().toISOString().split('T')[0];
        document.getElementById('filtroDataAgenda').value = hojeIso;
        document.getElementById('compData').value = hojeIso;
        
        let meuGrafico = null;
        let listaTagsGlobal = [];
        let tagFiltroAtual = 'TODAS';

        async function carregarTagsDoBanco() {
            const { data, error } = await _supabase.from('meufuturo_tags').select('*').order('nome', { ascending: true });
            if(!error && data) {
                listaTagsGlobal = data;
                atualizarBarraFiltros();
                atualizarSelectModal();
            }
        }

        function atualizarBarraFiltros() {
            const barra = document.getElementById('barraFiltroTags');
            barra.innerHTML = `
                <button onclick="filtrarPorTag('TODAS')" class="px-3 py-1 rounded-xl text-xs font-bold transition ${tagFiltroAtual === 'TODAS' ? 'bg-blue-600 text-white shadow' : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'}">Todos os Cadernos</button>
            `;
            listaTagsGlobal.forEach(t => {
                let ativo = tagFiltroAtual === t.nome;
                barra.innerHTML += `
                    <button onclick="filtrarPorTag('${t.nome}')" class="px-3 py-1 rounded-xl text-xs font-bold transition ${ativo ? 'bg-blue-600 text-white shadow' : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'}">#${t.nome}</button>
                `;
            });
            document.getElementById('filtroAtivoTexto').innerText = tagFiltroAtual === 'TODAS' ? 'Exibindo: Tudo' : `Filtrando por Caderno: #${tagFiltroAtual}`;
        }

        function filtrarPorTag(nomeTag) {
            tagFiltroAtual = nomeTag;
            atualizarBarraFiltros();
            carregarAgenda();
        }

        function atualizarSelectModal(selecionada = '') {
            const select = document.getElementById('compTag');
            select.innerHTML = '';
            
            if(listaTagsGlobal.length === 0) {
                const opt = document.createElement('option');
                opt.value = 'Geral';
                opt.innerText = 'Geral';
                select.appendChild(opt);
                return;
            }

            listaTagsGlobal.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.nome;
                opt.innerText = t.nome;
                if(t.nome === selecionada) opt.selected = true;
                select.appendChild(opt);
            });
        }

        atualizarTextoDataCabecalho(hojeIso);

        function atualizarTextoDataCabecalho(dataStr) {
            const [ano, mes, dia] = dataStr.split('-');
            const dataObj = new Date(ano, mes - 1, dia);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dataAtualTexto').innerText = dataObj.toLocaleDateString('pt-BR', options);
        }

        function mudarDia(dias) {
            const inputData = document.getElementById('filtroDataAgenda');
            const dataAtual = new Date(inputData.value + 'T00:00:00');
            dataAtual.setDate(dataAtual.getDate() + dias);
            inputData.value = dataAtual.toISOString().split('T')[0];
            carregarAgenda();
        }

        function irParaHoje() {
            document.getElementById('filtroDataAgenda').value = hojeIso;
            carregarAgenda();
        }

        function renderizarGrafico(estatisticas) {
            const ctx = document.getElementById('graficoDashboard').getContext('2d');
            if (meuGrafico) meuGrafico.destroy();

            const labels = Object.keys(estatisticas);
            const dadosHoras = Object.values(estatisticas).map(mins => (mins / 60).toFixed(1));
            const coresFixas = ['#3b82f6', '#10b981', '#f59e0b', '#a855f7', '#ec4899', '#0ea5e9', '#6366f1', '#14b8a6'];
            const cores = labels.map((_, index) => coresFixas[index % coresFixas.length]);

            meuGrafico = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{ data: dadosHoras, backgroundColor: cores, borderWidth: 0 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 }, boxWidth: 12 } } }
                }
            });
        }

        function calcularDashboard(data) {
            let totalBlocos = data.length;
            let estatisticas = {};

            listaTagsGlobal.forEach(t => estatisticas[t.nome] = 0);

            data.forEach(item => {
                let tag = item.tag || 'Geral';
                if(!estatisticas[tag]) estatisticas[tag] = 0;

                let diff = 60;
                if(item.hora_inicio && item.hora_fim) {
                    const [hIni, mIni] = item.hora_inicio.split(':').map(Number);
                    const [hFim, mFim] = item.hora_fim.split(':').map(Number);
                    let calc = (hFim * 60 + mFim) - (hIni * 60 + mIni);
                    if(calc > 0) diff = calc;
                }
                estatisticas[tag] += diff;
            });

            document.getElementById('dashTotalBlocos').innerText = totalBlocos;
            const containerResumo = document.getElementById('resumoTextoDashboard');
            containerResumo.innerHTML = `<div class="flex justify-between border-b border-slate-800/80 pb-1.5"><span class="text-slate-400">Total de Blocos:</span><span class="font-bold text-white">${totalBlocos}</span></div>`;

            for(const [tag, mins] of Object.entries(estatisticas)) {
                if(mins > 0) {
                    containerResumo.innerHTML += `<div class="flex justify-between border-b border-slate-800/80 pb-1.5"><span class="text-slate-300">#${tag}:</span><span class="font-bold text-blue-300">${(mins / 60).toFixed(1)}h</span></div>`;
                }
            }

            renderizarGrafico(estatisticas);
        }

        async function carregarAgenda() {
            const dataSelecionada = document.getElementById('filtroDataAgenda').value;
            atualizarTextoDataCabecalho(dataSelecionada);

            const lista = document.getElementById('listaAgenda');
            lista.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Buscando programação...</p>';

            let query = _supabase.from('meufuturo_agenda_v3').select('*').eq('data', dataSelecionada);
            if(tagFiltroAtual !== 'TODAS') {
                query = query.eq('tag', tagFiltroAtual);
            }

            const { data, error } = await query.order('hora_inicio', { ascending: true });

            if(error || !data || data.length === 0) {
                lista.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">Nenhum bloco encontrado ${tagFiltroAtual !== 'TODAS' ? 'no caderno #' + tagFiltroAtual : 'para este dia'}.</p>`;
                calcularDashboard([]);
                return;
            }

            calcularDashboard(data);
            lista.innerHTML = '';

            data.forEach(item => {
                const itemJson = JSON.stringify(item).replace(/"/g, '&quot;');
                lista.innerHTML += `
                    <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                                <span class="bg-blue-900/40 border border-blue-700/50 text-blue-300 font-bold px-2 py-0.5 rounded text-[10px]">${item.hora_inicio} - ${item.hora_fim || item.hora_inicio}</span>
                                <span class="font-bold text-white text-sm">${item.titulo}</span>
                                ${item.tag ? `<span class="bg-indigo-900/40 border border-indigo-700/50 text-indigo-300 px-2 py-0.5 rounded text-[10px] font-semibold">#${item.tag}</span>` : ''}
                                ${item.local ? `<span class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded text-[10px]"><i class="fa-solid fa-location-dot text-rose-400 mr-1"></i>${item.local}</span>` : ''}
                            </div>
                            ${item.descricao ? `<p class="text-slate-400 pl-1">${item.descricao}</p>` : ''}
                        </div>
                        <div class="flex items-center space-x-1 ml-2">
                            <button onclick="abrirModalEditar(${itemJson})" class="text-slate-400 hover:text-blue-400 p-2" title="Editar bloco"><i class="fa-solid fa-pen-to-square text-sm"></i></button>
                            <button onclick="excluirCompromisso('${item.id}')" class="text-rose-400 hover:text-rose-300 p-2" title="Excluir bloco"><i class="fa-solid fa-trash text-sm"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function abrirModalCriar() {
            let tagPadrao = tagFiltroAtual !== 'TODAS' ? tagFiltroAtual : (listaTagsGlobal.length > 0 ? listaTagsGlobal[0].nome : '');
            atualizarSelectModal(tagPadrao);
            
            document.getElementById('modalTituloForm').innerHTML = '<i class="fa-solid fa-calendar-plus mr-2"></i>Novo Bloco de Rotina';
            document.getElementById('compId').value = '';
            document.getElementById('compTitulo').value = '';
            document.getElementById('compLocal').value = '';
            document.getElementById('compInicio').value = '';
            document.getElementById('compFim').value = '';
            document.getElementById('compData').value = document.getElementById('filtroDataAgenda').value;
            document.getElementById('compDesc').value = '';
            document.getElementById('divRepetirContainer').style.display = 'block';
            document.getElementById('modalCompromisso').classList.remove('hidden');
        }

        function abrirModalEditar(item) {
            atualizarSelectModal(item.tag || '');
            document.getElementById('modalTituloForm').innerHTML = '<i class="fa-solid fa-pen-to-square mr-2"></i>Editar Bloco';
            document.getElementById('compId').value = item.id;
            document.getElementById('compTitulo').value = item.titulo || '';
            document.getElementById('compLocal').value = item.local || '';
            document.getElementById('compInicio').value = item.hora_inicio || '';
            document.getElementById('compFim').value = item.hora_fim || '';
            document.getElementById('compData').value = item.data || '';
            document.getElementById('compDesc').value = item.descricao || '';
            document.getElementById('divRepetirContainer').style.display = 'none';
            document.getElementById('modalCompromisso').classList.remove('hidden');
        }

        async function salvarCompromisso() {
            const btn = document.getElementById('btnSalvarCompromisso');
            btn.disabled = true;
            btn.innerText = 'Salvando...';

            const id = document.getElementById('compId').value;
            const titulo = document.getElementById('compTitulo').value;
            const tag = document.getElementById('compTag').value;
            const local = document.getElementById('compLocal').value;
            const horaInicio = document.getElementById('compInicio').value;
            const horaFim = document.getElementById('compFim').value;
            const dataInicial = document.getElementById('compData').value;
            const repetir = document.getElementById('compRepetir').value;
            const descricao = document.getElementById('compDesc').value;

            if(!titulo || !horaInicio || !dataInicial) {
                alert('Preencha ao menos o título, o horário de início e a data!');
                btn.disabled = false;
                btn.innerText = 'Salvar Bloco';
                return;
            }

            if(id) {
                const { error } = await _supabase.from('meufuturo_agenda_v3').update({
                    titulo, tag, local, hora_inicio: horaInicio, hora_fim: horaFim || null, data: dataInicial, descricao
                }).eq('id', id);

                if(error) {
                    alert('Erro ao atualizar: ' + error.message);
                    btn.disabled = false;
                    btn.innerText = 'Salvar Bloco';
                    return;
                }
            } else {
                let datasParaInserir = [dataInicial];

                if(repetir === 'seg_a_sex') {
                    let dataAtual = new Date(dataInicial + 'T00:00:00');
                    for(let i = 1; i < 28; i++) {
                        dataAtual.setDate(dataAtual.getDate() + 1);
                        let diaSemana = dataAtual.getDay();
                        if(diaSemana !== 0 && diaSemana !== 6) {
                            datasParaInserir.push(dataAtual.toISOString().split('T')[0]);
                        }
                    }
                } else if(repetir === 'semanal') {
                    let dataAtual = new Date(dataInicial + 'T00:00:00');
                    for(let i = 1; i < 8; i++) {
                        dataAtual.setDate(dataAtual.getDate() + 7);
                        datasParaInserir.push(dataAtual.toISOString().split('T')[0]);
                    }
                }

                const registros = datasParaInserir.map(d => ({
                    titulo, tag, local, hora_inicio: horaInicio, hora_fim: horaFim || null, data: d, descricao
                }));

                const { error } = await _supabase.from('meufuturo_agenda_v3').insert(registros);

                if(error) {
                    alert('Erro ao salvar: ' + error.message);
                    btn.disabled = false;
                    btn.innerText = 'Salvar Bloco';
                    return;
                }
            }

            fecharModalCompromisso();
            carregarAgenda();
            
            btn.disabled = false;
            btn.innerText = 'Salvar Bloco';
        }

        async function excluirCompromisso(id) {
            if(!confirm('Deseja remover este bloco da agenda?')) return;
            await _supabase.from('meufuturo_agenda_v3').delete().eq('id', id);
            carregarAgenda();
        }

        function fecharModalCompromisso() { document.getElementById('modalCompromisso').classList.add('hidden'); }

        carregarTagsDoBanco().then(() => {
            carregarAgenda();
        });
    </script>
</body>
</html>
