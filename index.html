<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Futuro - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-sm w-full space-y-6 shadow-2xl text-center">
        <h1 class="text-2xl font-extrabold text-emerald-400">Meu Futuro</h1>
        <form onsubmit="fazerLogin(event)" class="space-y-4">
            <input type="password" id="senha" placeholder="Digite sua senha" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white text-center outline-none focus:border-emerald-500">
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-3 rounded-xl transition">Entrar</button>
        </form>
    </div>
    <script>
        function fazerLogin(e) {
            e.preventDefault();
            const senha = document.getElementById('senha').value;
            // Defina sua senha aqui (ex: 1234 ou o que preferir)
            if (senha === '1234' || senha === 'admin') {
                localStorage.setItem('meufuturo_logado', 'true');
                window.location.href = 'home.html';
            } else {
                alert('Senha incorreta!');
            }
        }
    </script>
</body>
</html>
