<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Futuro - Assistente IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between pb-6">

    <script>
        if (localStorage.getItem('meufuturo_logado') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button onclick="window.location.href='home.html'" class="text-slate-400 hover:text-indigo-400 transition" title="Voltar ao Menu"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                <h1 class="text-lg font-bold text-indigo-400">Meu Futuro <span class="text-xs text-slate-400 font-normal">| Assistente IA</span></h1>
            </div>
            <button onclick="limparChat()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-2.5 py-1.5 rounded-lg transition" title="Limpar Conversa"><i class="fa-solid fa-trash-can mr-1"></i> Limpar</button>
        </div>
    </header>

    <!-- Área de Mensagens do Chat -->
    <main class="max-w-2xl w-full mx-auto p-4 flex-1 flex flex-col space-y-4 overflow-y-auto mb-20" id="chatContainer">
        <!-- Mensagem de boas-vindas da IA -->
        <div class="flex items-start space-x-3">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white shrink-0 font-bold text-xs"><i class="fa-solid fa-robot"></i></div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-xs sm:text-sm text-slate-200 max-w-[85%] space-y-2 shadow">
                <p>Olá, Diego! Sou o seu assistente inteligente integrado ao sistema **Meu Futuro**. Como posso te ajudar hoje com suas rotas, finanças, ideias ou organização?</p>
                <div class="flex flex-wrap gap-1.5 pt-2">
                    <button onclick="enviarSugestao('Como posso otimizar minhas rotas de entrega em São Paulo?')" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 text-[11px] px-2.5 py-1 rounded-lg border border-slate-700 transition">🚗 Otimizar rotas</button>
                    <button onclick="enviarSugestao('Me dê dicas de controle financeiro para motorista de entrega.')" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 text-[11px] px-2.5 py-1 rounded-lg border border-slate-700 transition">💰 Dicas financeiras</button>
                    <button onclick="enviarSugestao('Preciso de ideias criativas para papelaria e topo de bolo.')" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 text-[11px] px-2.5 py-1 rounded-lg border border-slate-700 transition">🎨 Ideias de papelaria</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Barra Inferior de Digitação (Fixa) -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3 fixed bottom-0 left-0 right-0 z-50">
        <div class="max-w-2xl mx-auto flex items-center space-x-2">
            <input type="text" id="inputMensagem" onkeypress="verificarEnter(event)" placeholder="Digite sua dúvida ou comando para a IA..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-indigo-500 transition">
            <button onclick="enviarMensagem()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-3 rounded-xl font-bold transition shadow-lg shadow-indigo-900/30 flex items-center justify-center"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </footer>

    <script>
        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        function enviarSugestao(texto) {
            document.getElementById('inputMensagem').value = texto;
            enviarMensagem();
        }

        function verificarEnter(e) {
            if (e.key === 'Enter') enviarMensagem();
        }

        function limparChat() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = `
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white shrink-0 font-bold text-xs"><i class="fa-solid fa-robot"></i></div>
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-xs sm:text-sm text-slate-200 max-w-[85%]">
                        <p>Conversa limpa. Como posso ajudar agora?</p>
                    </div>
                </div>
            `;
        }

        async function enviarMensagem() {
            const input = document.getElementById('inputMensagem');
            const texto = input.value.trim();
            if (!texto) return;

            const container = document.getElementById('chatContainer');

            // Adiciona a mensagem do usuário
            container.innerHTML += `
                <div class="flex items-start justify-end space-x-3">
                    <div class="bg-indigo-600 text-white p-4 rounded-2xl text-xs sm:text-sm max-w-[85%] shadow">
                        <p>${texto}</p>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-indigo-400 shrink-0 font-bold text-xs"><i class="fa-solid fa-user"></i></div>
                </div>
            `;
            input.value = '';
            scrollToBottom();

            // Balão temporário de "Pensando..."
            const idPensando = 'pensando_' + Date.now();
            container.innerHTML += `
                <div id="${idPensando}" class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white shrink-0 font-bold text-xs"><i class="fa-solid fa-robot"></i></div>
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-xs sm:text-sm text-slate-400 max-w-[85%] italic">
                        Pensando na resposta...
                    </div>
                </div>
            `;
            scrollToBottom();

            // Resposta simulada inteligente / ou integração futura com API
            setTimeout(() => {
                document.getElementById(idPensando)?.remove();
                
                let respostaIA = "Entendido, Diego! Como seu assistente no 'Meu Futuro', estou aqui para ajudar a organizar suas demandas diárias, rotas e projetos. Quer que eu ajude a detalhar mais sobre esse ponto?";
                
                const textoLower = texto.toLowerCase();
                if (textoLower.includes('rota') || textoLower.includes('entrega')) {
                    respostaIA = "Para otimizar suas entregas em São Paulo, procure agrupar os pedidos por regiões vizinhas antes de sair, utilize o cronômetro de deslocamento para registrar o tempo real de cada trecho e verifique sempre o trânsito nos horários de pico.";
                } else if (textoLower.includes('financeiro') || textoLower.includes('dinheiro') || textoLower.includes('controle')) {
                    respostaIA = "O controle financeiro é essencial! No nosso módulo financeiro, lembre-se de sempre dar baixa nas faturas de cartão ao pagar e registrar os abastecimentos no veículo para acompanhar exatamente o custo por quilômetro rodado.";
                } else if (textoLower.includes('papelaria') || textoLower.includes('topo de bolo') || textoLower.includes('ideia')) {
                    respostaIA = "Para os pedidos de papelaria criativa e topos de bolo, manter uma pasta de fotos de inspiração organizada por tema (como Mickey, super-heróis, etc.) agiliza muito o atendimento com os clientes e evita atrasos na produção!";
                }

                container.innerHTML += `
                    <div class="flex items-start space-x-3">
                        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white shrink-0 font-bold text-xs"><i class="fa-solid fa-robot"></i></div>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-xs sm:text-sm text-slate-200 max-w-[85%] space-y-2 shadow">
                            <p>${respostaIA}</p>
                        </div>
                    </div>
                `;
                scrollToBottom();
            }, 1000);
        }
    </script>
</body>
</html>
