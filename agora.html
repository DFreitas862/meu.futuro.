<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Futuro - Acontecendo Agora (Deslocamento & Local)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">

    <script>
        if (localStorage.getItem('meufuturo_logado') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button onclick="window.location.href='home.html'" class="text-slate-400 hover:text-blue-400 transition" title="Voltar ao Menu"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                <h1 class="text-lg font-bold text-blue-400">Meu Futuro <span class="text-xs text-slate-400 font-normal">| Rota & Tempo</span></h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="window.location.href='tags.html'" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-lg transition" title="Cadernos"><i class="fa-solid fa-book mr-1"></i> Cadernos</button>
                <button onclick="window.location.href='agenda.html'" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition" title="Agenda"><i class="fa-solid fa-calendar-days mr-1"></i> Agenda</button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto p-4 md:p-6 space-y-6">

        <!-- Card de Controle de Etapas -->
        <div id="cardPrincipal" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-5 text-center relative">
            
            <!-- Botão de Minimizar / Flutuar -->
            <button id="btnFlutuar" onclick="alternarModoFlutuante()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800/80 p-2 rounded-xl text-xs transition hidden" title="Modo Flutuante / Compacto">
                <i class="fa-solid fa-expand"></i>
            </button>

            <div class="space-y-1">
                <span id="badgeEtapa" class="text-xs font-bold text-blue-400 uppercase tracking-widest"><i class="fa-solid fa-route mr-1"></i> Etapa 1: Pronto para Iniciar</span>
                <h2 id="statusAtividade" class="text-sm text-slate-400">Insira os dados e clique em Iniciar Deslocamento</h2>
            </div>

            <!-- Display do Relógio / Cronômetro Principal -->
            <div id="displayTempo" class="text-5xl font-extrabold text-white font-mono tracking-wider py-4">
                00:00:00
            </div>

            <!-- Informações de Endereços em Tempo Real -->
            <div id="painelEnderecos" class="space-y-2 text-left bg-slate-950/60 p-3 rounded-xl border border-slate-800 text-[11px] text-slate-300">
                <div><strong class="text-blue-400">Origem:</strong> <span id="txtOrigem">Aguardando início...</span></div>
                <div><strong class="text-amber-400">Destino:</strong> <span id="txtDestino">Aguardando chegada...</span></div>
            </div>

            <!-- Configuração do Bipe Periódico -->
            <div id="painelBipConfig" class="bg-slate-950/40 p-3 rounded-xl border border-slate-800 text-left flex items-center justify-between gap-2">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-bell text-amber-400 text-sm"></i>
                    <div>
                        <span class="text-xs font-bold text-white block">Alerta Sonoro (Elegante)</span>
                        <span class="text-[10px] text-slate-400">Toque tipo carrilhão suave</span>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <select id="inputIntervaloBip" class="bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-xs text-amber-400 font-bold outline-none">
                        <option value="0">Desativado</option>
                        <option value="1">A cada 1 min</option>
                        <option value="5" selected>A cada 5 min</option>
                        <option value="10">A cada 10 min</option>
                        <option value="15">A cada 15 min</option>
                        <option value="30">A cada 30 min</option>
                    </select>
                </div>
            </div>

            <!-- Formulário de Configuração -->
            <div id="painelConfig" class="space-y-3 text-left">
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">Título da Atividade / Serviço</label>
                    <input type="text" id="inputTitulo" placeholder="Ex: Corrida de Entrega, Visita Cliente..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500 transition">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Caderno (Assunto)</label>
                        <select id="inputTag" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none">
                            <option value="Geral">Geral</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Local Genérico</label>
                        <input type="text" id="inputLocal" placeholder="Ex: São Paulo, Centro..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">Observações (Pode escrever durante o processo)</label>
                    <textarea id="inputDesc" rows="2" placeholder="Notas adicionais..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500 transition"></textarea>
                </div>
            </div>

            <!-- Botão Dinâmico de Ação por Etapas -->
            <div class="pt-2">
                <button id="btnAcao" onclick="executarEtapa()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl py-3.5 text-sm font-bold transition shadow-lg shadow-emerald-900/30 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play text-base"></i>
                    <span>1. Iniciar Deslocamento</span>
                </button>
            </div>
        </div>

    </main>

    <!-- Modal Pop-up de Resumo Final -->
    <div id="modalResumo" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-[999]">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl text-center">
            <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="text-lg font-bold text-white">Atividade Finalizada!</h3>
            <div id="conteudoResumo" class="space-y-2 text-left bg-slate-950/60 p-4 rounded-xl border border-slate-800 text-xs text-slate-300">
                <!-- Preenchido via JS -->
            </div>
            <button onclick="fecharModalResumo()" class="w-full bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-3 text-xs font-bold transition">OK, Novo Registo</button>
        </div>
    </div>

    <script src="supabase.js"></script>

    <script>
        function obterDataLocalIso() {
            const agora = new Date();
            return agora.toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
        }

        let etapaAtual = 1; 
        let timerInterval = null;
        let tempoInicioMs = 0;
        let modoFlutuanteAtivo = false;
        
        let horaInicioDeslocamento = '';
        let horaChegadaLocal = '';
        let horaFimTotal = '';
        
        let latInicio = null, lonInicio = null;
        let latChegada = null, lonChegada = null;
        
        let segundosDeslocamento = 0;
        let segundosPermanencia = 0;

        // Bipe elegante estilo carrilhão / sino de cristal (suave e refinado)
        function emitirSomBip() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                function tocarNotaElegante(frequencia, atraso, duracao) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sine'; // Onda senoidal pura (som limpo e aveludado)
                    osc.frequency.setValueAtTime(frequencia, audioCtx.currentTime + atraso);
                    
                    gain.gain.setValueAtTime(0.001, audioCtx.currentTime + atraso);
                    gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + atraso + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + atraso + duracao);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + atraso);
                    osc.stop(audioCtx.currentTime + atraso + duracao);
                }

                // Acorde harmonioso tipo carrilhão
                tocarNotaElegante(523.25, 0.0, 0.8);  // Nota Dó (C5)
                tocarNotaElegante(659.25, 0.1, 0.8);  // Nota Mi (E5)
                tocarNotaElegante(783.99, 0.2, 1.0);  // Nota Sol (G5)

            } catch (e) {
                console.log('Áudio não suportado.');
            }
        }

        function alternarModoFlutuante() {
            modoFlutuanteAtivo = !modoFlutuanteAtivo;
            const card = document.getElementById('cardPrincipal');
            const painelConfig = document.getElementById('painelConfig');
            const painelBip = document.getElementById('painelBipConfig');
            const painelEnd = document.getElementById('painelEnderecos');
            const btnFlutuarIcon = document.querySelector('#btnFlutuar i');

            if (modoFlutuanteAtivo) {
                painelConfig.style.display = 'none';
                painelBip.style.display = 'none';
                painelEnd.style.display = 'none';
                card.classList.add('fixed', 'top-4', 'left-4', 'right-4', 'z-[998]', 'shadow-2xl', 'border-blue-500/50');
                btnFlutuarIcon.className = 'fa-solid fa-compress';
            } else {
                painelConfig.style.display = 'block';
                painelBip.style.display = 'flex';
                painelEnd.style.display = 'block';
                card.classList.remove('fixed', 'top-4', 'left-4', 'right-4', 'z-[998]', 'shadow-2xl', 'border-blue-500/50');
                btnFlutuarIcon.className = 'fa-solid fa-expand';
            }
        }

        async function carregarTagsNoSelect() {
            try {
                const { data, error } = await _supabase.from('meufuturo_tags').select('*').order('nome', { ascending: true });
                const select = document.getElementById('inputTag');
                if(!select) return;
                select.innerHTML = '';
                if(!error && data && data.length > 0) {
                    data.forEach(t => { select.innerHTML += `<option value="${t.nome}">${t.nome}</option>`; });
                } else {
                    select.innerHTML = '<option value="Geral">Geral</option>';
                }
            } catch(e) { console.error(e); }
        }

        function formatarTempo(segundos) {
            const h = Math.floor(segundos / 3600).toString().padStart(2, '0');
            const m = Math.floor((segundos % 3600) / 60).toString().padStart(2, '0');
            const s = (segundos % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        async function obterEnderecoAtual() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ endereco: "Geolocalização não suportada", lat: null, lon: null });
                    return;
                }
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    try {
                        const resposta = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
                        const dados = await resposta.json();
                        const rua = dados.address.road || dados.address.suburb || 'Localização atual';
                        const cidade = dados.address.city || dados.address.town || dados.address.municipality || '';
                        resolve({ endereco: `${rua}, ${cidade}`, lat, lon });
                    } catch (e) {
                        resolve({ endereco: `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`, lat, lon });
                    }
                }, () => {
                    resolve({ endereco: "Permissão de GPS negada ou indisponível", lat: null, lon: null });
                }, { timeout: 10000 });
            });
        }

        function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function atualizarRelogio() {
            const agoraMs = Date.now();
            const segundosDecorridos = Math.floor((agoraMs - tempoInicioMs) / 1000);
            document.getElementById('displayTempo').innerText = formatarTempo(segundosDecorridos);

            const intervaloMinutos = parseInt(document.getElementById('inputIntervaloBip').value) || 0;
            if (intervaloMinutos > 0 && segundosDecorridos > 0 && segundosDecorridos % (intervaloMinutos * 60) === 0) {
                emitirSomBip();
            }
        }

        async function executarEtapa() {
            const btn = document.getElementById('btnAcao');
            const badge = document.getElementById('badgeEtapa');
            const status = document.getElementById('statusAtividade');
            const tituloInput = document.getElementById('inputTitulo');

            if (etapaAtual === 1) {
                const titulo = tituloInput.value.trim();
                if (!titulo) {
                    alert('Por favor, informe o título da atividade!');
                    return;
                }

                btn.disabled = true;
                btn.innerText = 'Capturando GPS de origem...';

                const dadosGps = await obterEnderecoAtual();
                latInicio = dadosGps.lat;
                lonInicio = dadosGps.lon;
                document.getElementById('txtOrigem').innerText = dadosGps.endereco;

                const agora = new Date();
                horaInicioDeslocamento = agora.toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', hour12: false });
                tempoInicioMs = agora.getTime();

                etapaAtual = 2;
                badge.innerHTML = '<i class="fa-solid fa-car text-amber-400 mr-1"></i> Etapa 2: Em Deslocamento';
                status.innerText = 'Cronômetro de deslocamento rodando...';
                
                document.getElementById('btnFlutuar').classList.remove('hidden');

                document.getElementById('inputTitulo').disabled = true;
                document.getElementById('inputTag').disabled = true;
                document.getElementById('inputLocal').disabled = true;
                document.getElementById('inputIntervaloBip').disabled = true;
                document.getElementById('inputTitulo').style.opacity = '0.5';
                document.getElementById('inputTag').style.opacity = '0.5';
                document.getElementById('inputLocal').style.opacity = '0.5';

                timerInterval = setInterval(atualizarRelogio, 1000);
                
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-map-pin text-base"></i><span>2. Cheguei ao Destino</span>';
                btn.className = 'w-full bg-amber-600 hover:bg-amber-500 text-white rounded-xl py-3.5 text-sm font-bold transition shadow-lg shadow-amber-900/30 flex items-center justify-center space-x-2';

            } else if (etapaAtual === 2) {
                btn.disabled = true;
                btn.innerText = 'Capturando GPS de chegada...';

                const agoraMs = Date.now();
                segundosDeslocamento = Math.floor((agoraMs - tempoInicioMs) / 1000);

                const dadosGps = await obterEnderecoAtual();
                latChegada = dadosGps.lat;
                lonChegada = dadosGps.lon;
                document.getElementById('txtDestino').innerText = dadosGps.endereco;

                const agora = new Date();
                horaChegadaLocal = agora.toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', hour12: false });
                
                tempoInicioMs = agora.getTime();
                segundosPermanencia = 0;

                if (modoFlutuanteAtivo) alternarModoFlutuante();

                etapaAtual = 3;
                badge.innerHTML = '<i class="fa-solid fa-clock text-indigo-400 mr-1"></i> Etapa 3: Permanência no Local';
                status.innerText = 'Tempo de atendimento/permanência a contar...';

                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-flag-checkered text-base"></i><span>3. Finalizar Atividade</span>';
                btn.className = 'w-full bg-rose-600 hover:bg-rose-500 text-white rounded-xl py-3.5 text-sm font-bold transition shadow-lg shadow-rose-900/30 flex items-center justify-center space-x-2';

            } else if (etapaAtual === 3) {
                clearInterval(timerInterval);
                btn.disabled = true;
                btn.innerText = 'A salvar no histórico...';

                const agoraMs = Date.now();
                segundosPermanencia = Math.floor((agoraMs - tempoInicioMs) / 1000);

                const agora = new Date();
                horaFimTotal = agora.toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', hour12: false });

                const distanciaKm = calcularDistanciaKm(latInicio, lonInicio, latChegada, lonChegada);
                const kmFormatado = distanciaKm > 0 ? distanciaKm.toFixed(2) : "0.00";

                const titulo = tituloInput.value.trim();
                const tag = document.getElementById('inputTag').value;
                const local = document.getElementById('inputLocal').value.trim();
                const notaUsuario = document.getElementById('inputDesc').value.trim();

                const textoDeslocamento = formatarTempo(segundosDeslocamento);
                const textoPermanencia = formatarTempo(segundosPermanencia);

                const descricaoFinal = `${notaUsuario ? notaUsuario + ' | ' : ''}Deslocamento: ${textoDeslocamento} | Permanência: ${textoPermanencia} | Distância: ${kmFormatado} km`;
                const dataHoje = obterDataLocalIso();

                const { error } = await _supabase.from('meufuturo_agenda_v3').insert([{
                    titulo,
                    tag,
                    local: local || null,
                    hora_inicio: horaInicioDeslocamento,
                    hora_fim: horaFimTotal,
                    data: dataHoje,
                    descricao: descricaoFinal
                }]);

                if(error) {
                    alert('Erro ao salvar: ' + error.message);
                    btn.disabled = false;
                    btn.innerText = '3. Finalizar Atividade';
                    return;
                }

                if (modoFlutuanteAtivo) alternarModoFlutuante();
                document.getElementById('btnFlutuar').classList.add('hidden');

                const containerResumo = document.getElementById('conteudoResumo');
                containerResumo.innerHTML = `
                    <div><strong>Atividade:</strong> ${titulo}</div>
                    <div><strong>Deslocamento:</strong> ${textoDeslocamento}</div>
                    <div><strong>Permanência no Local:</strong> ${textoPermanencia}</div>
                    <div><strong>Distância Percorrida:</strong> ${kmFormatado} km</div>
                `;
                
                const modal = document.getElementById('modalResumo');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function fecharModalResumo() {
            const modal = document.getElementById('modalResumo');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            window.location.reload(); 
        }

        carregarTagsNoSelect();
    </script>
</body>
</html>
